<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="人工呼吸中の圧-容量曲線とLIP・UIPを示す模式図">
  <title>圧−容量曲線（吸気側）とLIP・UIP</title>
  <defs>
    <style>
      .lbl{font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;fill:#0f172a}
      .ttl{font-size:19px;font-weight:700}
      .ax{font-size:13px;fill:#475569}
      .an{font-size:13px;fill:#334155}
      .nt{font-size:13px;fill:#475569}
      .curve{fill:none;stroke:#1d4ed8;stroke-width:3.4;stroke-linecap:round}
      .gd{fill:none;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:5 4}
      .axis{stroke:#334155;stroke-width:2}
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text class="lbl ttl" x="28" y="32">圧−容量曲線（吸気側）とLIP・UIP</text>

  <!-- 安全域の帯 -->
  <rect x="196" y="70" width="296" height="330" fill="#dcfce7" opacity="0.55"/>
  <text class="lbl an" x="344" y="92" text-anchor="middle" fill="#15803d" font-weight="700">肺保護換気の目標域</text>

  <!-- 軸 -->
  <line class="axis" x1="96" y1="400" x2="706" y2="400"/>
  <line class="axis" x1="96" y1="400" x2="96" y2="70"/>
  <text class="lbl ax" x="706" y="424" text-anchor="end">気道内圧（cmH₂O）</text>
  <text class="lbl ax" x="88" y="58">肺気量</text>

  <!-- 曲線 -->
  <path class="curve" d="M104 392 C 140 388 172 374 196 352 L 470 178 C 492 162 512 150 560 140 C 610 130 660 126 692 124"/>

  <!-- LIP -->
  <circle cx="196" cy="352" r="6" fill="#b91c1c"/>
  <path class="gd" d="M196 352 L196 400"/>
  <text class="lbl an" x="196" y="336" text-anchor="middle" fill="#b91c1c" font-weight="700">LIP（下位変曲点）</text>
  <text class="lbl nt" x="150" y="424">PEEPはここ以上</text>

  <!-- UIP -->
  <circle cx="492" cy="164" r="6" fill="#b91c1c"/>
  <path class="gd" d="M492 164 L492 400"/>
  <text class="lbl an" x="516" y="152" fill="#b91c1c" font-weight="700">UIP（上位変曲点）</text>
  <text class="lbl nt" x="492" y="424" text-anchor="middle">最大気道内圧はここ以下</text>

  <!-- コンプライアンス -->
  <path class="gd" d="M300 286 L392 286 L392 228"/>
  <text class="lbl an" x="346" y="306" text-anchor="middle" fill="#0f766e" font-weight="700">ΔP</text>
  <text class="lbl an" x="404" y="262" fill="#0f766e" font-weight="700">ΔV</text>
  <text class="lbl an" x="404" y="286" fill="#0f766e">傾き＝コンプライアンス　C＝ΔV／ΔP</text>

  <text class="lbl nt" x="28" y="450">LIPより下では虚脱した肺胞が再開通と虚脱を繰り返し（atelectrauma）、UIPを超えると過伸展による圧・容量損傷をきたす。</text>
</svg>
