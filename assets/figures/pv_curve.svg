<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 510" width="740" height="510" role="img" aria-label="静的肺圧-容量曲線（P-V曲線）の模式図">
  <title>静的肺圧-容量曲線（P-V曲線）</title>
  <defs>
    <style>
      .lbl{font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;fill:#0f172a}
      .ttl{font-size:19px;font-weight:700}
      .ax{font-size:13px;fill:#475569}
      .nm{font-size:15px;font-weight:700}
      .nt{font-size:13px;fill:#64748b}
      .grid{stroke:#e2e8f0;stroke-width:1}
      .axis{stroke:#334155;stroke-width:2}
      .cv{fill:none;stroke-width:3.5;stroke-linecap:round}
    </style>
  </defs>

  <rect x="0" y="0" width="740" height="510" fill="#ffffff"/>
  <text class="lbl ttl" x="28" y="32">静的肺圧-容量曲線（P-V曲線）</text>

  <!-- 目盛 -->
  <g class="grid">
    <line x1="90" y1="400" x2="640" y2="400"/>
    <line x1="90" y1="352" x2="640" y2="352"/>
    <line x1="90" y1="303" x2="640" y2="303"/>
    <line x1="90" y1="255" x2="640" y2="255"/>
    <line x1="90" y1="206" x2="640" y2="206"/>
    <line x1="90" y1="158" x2="640" y2="158"/>
    <line x1="90" y1="109" x2="640" y2="109"/>
    <line x1="90" y1="61" x2="640" y2="61"/>
  </g>
  <g class="axis">
    <line x1="90" y1="52" x2="90" y2="400"/>
    <line x1="90" y1="400" x2="648" y2="400"/>
  </g>
  <g class="lbl ax" text-anchor="end">
    <text x="82" y="405">0</text>
    <text x="82" y="357">20</text>
    <text x="82" y="308">40</text>
    <text x="82" y="260">60</text>
    <text x="82" y="211">80</text>
    <text x="82" y="163">100</text>
    <text x="82" y="114">120</text>
    <text x="82" y="66">140</text>
  </g>
  <text class="lbl ax" x="96" y="48">%TLCpred（％）</text>
  <g class="lbl ax" text-anchor="middle">
    <text x="178" y="422">10</text>
    <text x="266" y="422">20</text>
    <text x="355" y="422">30</text>
    <text x="443" y="422">40</text>
    <text x="531" y="422">50</text>
    <text x="620" y="422">60</text>
  </g>
  <text class="lbl ax" x="648" y="422" text-anchor="end" dy="18">Pes（cmH₂O）</text>

  <!-- COPD：左上方へシフト、傾きが急峻 -->
  <path class="cv" stroke="#b91c1c"
        d="M117 254 C 128 214, 138 160, 152 120 C 168 84, 196 66, 232 60 C 268 56, 300 55, 330 55"/>
  <!-- 若年健常人 -->
  <path class="cv" stroke="#1d4ed8"
        d="M117 303 C 140 268, 166 228, 196 202 C 232 175, 278 162, 320 157 C 356 154, 384 153, 410 153"/>
  <!-- 肺線維症：右下方へシフト、傾きが小さい -->
  <path class="cv" stroke="#0f766e"
        d="M143 347 C 190 323, 250 296, 320 275 C 400 256, 500 243, 620 234"/>

  <!-- FRCの位置 -->
  <g stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 4">
    <line x1="90" y1="254" x2="117" y2="254"/>
    <line x1="90" y1="303" x2="117" y2="303"/>
    <line x1="90" y1="347" x2="143" y2="347"/>
  </g>
  <g fill="#0f172a">
    <circle cx="117" cy="254" r="5"/>
    <circle cx="117" cy="303" r="5"/>
    <circle cx="143" cy="347" r="5"/>
  </g>

  <!-- 曲線のラベル -->
  <text class="lbl nm" x="344" y="50" fill="#b91c1c">COPD・高齢</text>
  <text class="lbl nm" x="424" y="158" fill="#1d4ed8">若年健常人</text>
  <text class="lbl nm" x="632" y="228" text-anchor="end" fill="#0f766e">肺線維症</text>

  <!-- 注記 -->
  <g class="lbl nt">
    <text x="28" y="452">● はそれぞれの病態でのFRCの位置。COPDでは高位（過膨張）、肺線維症では低位となる。</text>
    <text x="28" y="474">COPD・高齢：肺弾性力の低下でコンプライアンスが増大し、曲線は<tspan font-weight="700">左上方</tspan>へシフトする。</text>
    <text x="28" y="496">肺線維症：コンプライアンスが低下して傾きが小さくなり、<tspan font-weight="700">右下方</tspan>へシフトする。</text>
  </g>
</svg>
